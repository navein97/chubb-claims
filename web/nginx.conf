# Serves the Angular build and routes API calls to the right service,
# mirroring proxy.conf.json used by `ng serve`. Same origin, so no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/insights/ {
    proxy_pass http://insights-service:8082;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://claims-service:8081;
    proxy_set_header Host $host;
  }

  # Client-side routes (/claimant/..., /staff/...) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
