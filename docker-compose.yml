services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  claims-service:
    build:
      context: .
      dockerfile: claims-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claims
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  insights-service:
    build:
      context: .
      dockerfile: insights-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/insights
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
